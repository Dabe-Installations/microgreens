<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Microgreens · Tiny Greens</title>
<meta name="theme-color" content="#5BAE5B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tiny Greens">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
--green:#5BAE5B; --green-dark:#3E8E41; --leaf:#7CC46E; --mint:#E6F4E1;
--cream:#FFF8EC; --ink:#2F3A2F; --muted:#6F7B6C;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--cream);color:var(--ink);font-family:'Nunito',system-ui,sans-serif}
body{padding-bottom:calc(30px + env(safe-area-inset-bottom))}

.rise{opacity:0;transform:translateY(60px);animation:rise .7s cubic-bezier(.2,.9,.3,1.15) forwards}
.d1{animation-delay:.12s}.d2{animation-delay:.24s}.d3{animation-delay:.36s}
@keyframes rise{to{opacity:1;transform:none}}

header{background:var(--green);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 24px 54px;border-radius:0 0 36px 36px}
.back{display:inline-flex;align-items:center;gap:6px;color:#fff;text-decoration:none;font:600 16px 'Fredoka',sans-serif;background:rgba(255,255,255,.2);padding:8px 16px 8px 12px;border-radius:99px}
.back:active{transform:scale(.95)}
.title{display:flex;align-items:center;gap:14px;margin-top:22px}
.title .badge{flex:0 0 58px;height:58px;border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,.12)}
header h1{font-family:'Fredoka',sans-serif;font-weight:700;font-size:32px;line-height:1.1}
header p{opacity:.92;margin-top:4px;font-size:15.5px}

main{padding:0 20px;margin-top:-30px;display:flex;flex-direction:column;gap:16px;max-width:520px;margin-left:auto;margin-right:auto}
.label{font-family:'Fredoka',sans-serif;font-weight:600;color:var(--green-dark);font-size:15px;letter-spacing:.6px;text-transform:uppercase;margin:44px 4px -4px}

.variety{display:flex;align-items:center;gap:16px;background:#fff;border-radius:26px;padding:16px 18px;box-shadow:0 10px 26px rgba(62,142,65,.14);text-decoration:none;color:inherit;transition:transform .15s ease}
.variety:active{transform:scale(.97)}
.variety .art{flex:0 0 72px;height:72px;border-radius:20px;background:var(--mint);display:flex;align-items:center;justify-content:center}
.variety h3{font-family:'Fredoka',sans-serif;font-weight:600;font-size:23px}
.variety .go{margin-left:auto;flex:0 0 38px;height:38px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700}

.more{border:2px dashed #CFE3C8;border-radius:26px;padding:16px;text-align:center;color:var(--muted);font-size:14.5px}
</style>
</head>
<body>

<header class="rise">
  <a class="back" href="index.html">‹ Home</a>
  <div class="title">
    <div class="badge">
      <svg width="40" height="40" viewBox="0 0 64 64"><rect x="8" y="42" width="48" height="10" rx="5" fill="#E8D6AE"/>
        <g stroke="#3E8E41" stroke-width="3" stroke-linecap="round"><path d="M20 43V28"/><path d="M32 43V20"/><path d="M44 43V28"/></g>
        <g fill="#7CC46E"><ellipse cx="15" cy="26" rx="6" ry="3.5"/><ellipse cx="25" cy="26" rx="6" ry="3.5" fill="#5BAE5B"/><ellipse cx="27" cy="18" rx="6" ry="3.5"/><ellipse cx="37" cy="18" rx="6" ry="3.5" fill="#5BAE5B"/><ellipse cx="39" cy="26" rx="6" ry="3.5"/><ellipse cx="49" cy="26" rx="6" ry="3.5" fill="#5BAE5B"/></g></svg>
    </div>
    <div>
      <h1>Microgreens</h1>
      <p>Grown on hemp mats, cut when tiny.</p>
    </div>
  </div>
</header>

<main>
  <div class="label rise d1">Choose your variety</div>

  <!-- Wheatgrass -->
  <a class="variety rise d2" href="wheatgrass.html" data-variety="wheatgrass">
    <div class="art">
      <svg width="52" height="52" viewBox="0 0 64 64"><rect x="8" y="46" width="48" height="8" rx="4" fill="#E8D6AE"/>
        <g stroke-linecap="round" stroke-width="3.2" fill="none">
          <path d="M14 47C14 34 12 24 9 14" stroke="#5BAE5B"/><path d="M22 47C22 32 21 20 19 8" stroke="#7CC46E"/>
          <path d="M30 47C30 32 31 20 30 6" stroke="#3E8E41"/><path d="M38 47C38 32 40 20 42 9" stroke="#7CC46E"/>
          <path d="M46 47C46 34 48 24 52 13" stroke="#5BAE5B"/><path d="M26 47C26 36 25 28 24 20" stroke="#5BAE5B"/>
          <path d="M42 47C42 36 43 28 45 21" stroke="#3E8E41"/></g></svg>
    </div>
    <h3>Wheatgrass</h3>
    <span class="go">›</span>
  </a>

  <div class="more rise d3">🌱 More varieties coming soon</div>
</main>

</body>
</html>
